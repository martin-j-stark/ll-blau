# Holt alle 15 Minuten den Outlook-Kalender und veröffentlicht ihn zusammen mit der Seite.
# So braucht die Seite keinen fremden Proxy-Dienst.
name: Kalender aktualisieren

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 5-18 * * 1-5"   # Mo–Fr, ca. 6–20 Uhr Schweizer Zeit
    - cron: "0 */3 * * *"         # sonst alle 3 Stunden
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Kalender abrufen
        env:
          ID: cad5169b7d66437a98a4138f0e1fd5b6@schule-herisau.ar.ch/e7e66a07ec2f4ed097fa8cdecf20bc5c15907840639511666056
          SITE: https://martin-j-stark.github.io/ll-blau
        run: |
          mkdir -p _site
          cp index.html _site/
          cp index.html _site/timer.html
          cp mitteilung.json _site/ 2>/dev/null || echo "{}" > _site/mitteilung.json
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for attempt in 1 2 3; do
            for url in \
              "https://outlook.office365.com/owa/calendar/$ID/calendar.ics" \
              "https://outlook.office365.com/calendar/published/$ID/calendar.ics" \
              "https://outlook.office.com/owa/calendar/$ID/calendar.ics" \
              "https://outlook.live.com/owa/calendar/$ID/calendar.ics"; do
              for ip in -4 -6; do
                echo "Versuch $attempt ($ip): $url"
                if curl $ip -fsSL --http1.1 --connect-timeout 15 -m 60 -A "$UA" "$url" -o /tmp/cal.ics 2>&1 && grep -q "BEGIN:VCALENDAR" /tmp/cal.ics; then
                  mv /tmp/cal.ics _site/calendar.ics
                  date -u +%Y-%m-%dT%H:%M:%SZ > _site/kalender-stand.txt
                  echo "OK: $(grep -c BEGIN:VEVENT _site/calendar.ics) Termine"
                  exit 0
                fi
              done
            done
            sleep 20
          done
          echo "::warning::Outlook nicht erreichbar – letzter Stand wird weiterverwendet"
          curl -fsSL -m 60 "$SITE/calendar.ics?t=$(date +%s)" -o _site/calendar.ics && grep -q "BEGIN:VCALENDAR" _site/calendar.ics || rm -f _site/calendar.ics
          curl -fsSL -m 30 "$SITE/kalender-stand.txt?t=$(date +%s)" -o _site/kalender-stand.txt || echo "unbekannt" > _site/kalender-stand.txt
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
