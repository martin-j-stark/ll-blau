# Holt alle 15 Minuten den Outlook-Kalender und veröffentlicht ihn zusammen mit der Seite.
# So braucht die Seite keinen fremden Proxy-Dienst.
name: Kalender aktualisieren

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 5-18 * * 1-5"   # Mo–Fr, ca. 6–20 Uhr Schweizer Zeit
    - cron: "0 */3 * * *"         # sonst alle 3 Stunden
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Letzten Kalender-Stand laden
        uses: actions/cache/restore@v4
        with:
          path: .cal-cache
          key: kalender-${{ github.run_id }}
          restore-keys: kalender-

      - name: Kalender abrufen
        env:
          ID: cad5169b7d66437a98a4138f0e1fd5b6@schule-herisau.ar.ch/e7e66a07ec2f4ed097fa8cdecf20bc5c15907840639511666056
        run: |
          mkdir -p _site .cal-cache
          cp index.html _site/
          cp index.html _site/timer.html
          cp mitteilung.json _site/ 2>/dev/null || echo "{}" > _site/mitteilung.json
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          ICS="https://outlook.office365.com/owa/calendar/$ID/calendar.ics"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$ICS")
          ok() { grep -q "BEGIN:VCALENDAR" /tmp/cal.ics 2>/dev/null; }
          save() {
            mv /tmp/cal.ics _site/calendar.ics
            date -u +%Y-%m-%dT%H:%M:%SZ > _site/kalender-stand.txt
            cp _site/calendar.ics _site/kalender-stand.txt .cal-cache/
            echo "OK über $1: $(grep -c BEGIN:VEVENT _site/calendar.ics) Termine"
            echo "FRESH=1" >> $GITHUB_ENV
          }
          # 1) direkt bei Outlook
          for url in "$ICS" "https://outlook.office365.com/calendar/published/$ID/calendar.ics" "https://outlook.office.com/owa/calendar/$ID/calendar.ics"; do
            echo "Direkt: $url"
            curl -4 -fsSL --http1.1 --connect-timeout 12 -m 45 -A "$UA" "$url" -o /tmp/cal.ics && ok && { save direkt; exit 0; }
          done
          # 2) über Zwischendienste (andere Server, die Outlook nicht sperrt)
          for p in \
            "https://api.allorigins.win/raw?url=$ENC" \
            "https://corsproxy.io/?url=$ENC" \
            "https://api.codetabs.com/v1/proxy?quest=$ICS" \
            "https://thingproxy.freeboard.io/fetch/$ICS"; do
            echo "Proxy: ${p%%\?*}"
            curl -fsSL --connect-timeout 15 -m 60 -A "$UA" "$p" -o /tmp/cal.ics && ok && { save proxy; exit 0; }
          done
          # 3) letzter gespeicherter Stand
          echo "::warning::Outlook nicht erreichbar – letzter gespeicherter Stand wird verwendet"
          if [ -f .cal-cache/calendar.ics ]; then
            cp .cal-cache/calendar.ics _site/; cp .cal-cache/kalender-stand.txt _site/ 2>/dev/null || true
            echo "Stand: $(cat _site/kalender-stand.txt 2>/dev/null)"
          else
            echo "Kein gespeicherter Stand vorhanden."
          fi

      - name: Kalender-Stand sichern
        if: env.FRESH == '1'
        uses: actions/cache/save@v4
        with:
          path: .cal-cache
          key: kalender-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
